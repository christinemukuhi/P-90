<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Your Puppy’s First 90 Days</title>
<meta name="robots" content="noindex, nofollow, noarchive">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#fcf1e8">
<meta name="description" content="A calmer start, one day at a time. Your puppy planner, roadmap, logs and memories.">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Day by Paw">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root{--g:#94a287;--gd:#56664a;--gl:#efd9d2;--p:#e6ece0;--c:#fff;--bg:#f6f0e6;--t:#333;--m:#888;--ln:#d9d2c3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--t);font:15px/1.45 -apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
header{background:#e9cdc6;color:var(--gd);padding:14px 16px}
header h1{margin:0;font-size:22px}header p{margin:2px 0 0;font-size:13px;opacity:.9}
nav{display:flex;gap:6px;overflow-x:auto;padding:10px 12px;background:var(--g);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
nav button{flex:none;border:0;border-radius:18px;padding:7px 13px;background:#fff;color:var(--gd);font-weight:600;cursor:pointer}
nav button.on{background:var(--gd);color:#fff}
main{max-width:860px;margin:0 auto;padding:16px}
h2{color:var(--gd);margin:6px 0 12px}h3{color:var(--gd);background:var(--gl);padding:6px 10px;border-radius:8px;font-size:13px;text-transform:uppercase;letter-spacing:.04em;margin:18px 0 8px}
.card{background:var(--gl);border-radius:14px;padding:12px 14px;margin:10px 0}
.pink{background:var(--p)}
label{display:block;font-weight:600;color:var(--gd);font-size:13px;margin:10px 0 2px}
input[type=text],input[type=date],input[type=time],input[type=number],textarea,select{width:100%;padding:8px;border:1px solid var(--ln);border-radius:8px;background:var(--c);color:var(--t);font:inherit}
textarea{min-height:70px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}.row>*{flex:1 1 120px}
.chk{display:flex;gap:8px;align-items:center;margin:6px 0}.chk input{width:20px;height:20px;accent-color:var(--gd);flex:none}
.chk input[type=text]{flex:1}.own{margin:10px 0}.own input[type=text]{padding:16px 10px;font-size:16px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.day{border:1px solid var(--ln);border-radius:8px;padding:4px;text-align:center;font-size:12px;background:var(--bg)}
.day.ci{border:2px solid var(--gd)}.day.done{background:var(--g);color:#fff}
.day input{display:block;margin:3px auto 0;width:18px;height:18px;accent-color:var(--gd)}
.bar{height:12px;background:var(--gl);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--g)}
.phases{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}
.rate{display:flex;gap:6px}.rate button,.mood button{border:1.5px solid var(--gd);background:none;color:var(--gd);border-radius:50%;width:32px;height:32px;cursor:pointer}
.rate button.on{background:var(--gd);color:var(--bg)}
.mood{display:flex;gap:6px;flex-wrap:wrap}.mood button{border-radius:16px;width:auto;padding:0 12px;height:34px}.mood button.on{background:var(--gd);color:var(--bg)}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:520px}
th{background:var(--g);color:#fff;text-align:left;padding:6px;font-size:12px}td{border:1px solid var(--ln);padding:0}td input{border:0;border-radius:0;width:100%;min-width:70px}
.btn{border:0;border-radius:10px;padding:9px 14px;background:var(--gd);color:var(--bg);font-weight:600;cursor:pointer;margin:8px 6px 0 0}
.btn.alt{background:var(--gl);color:var(--gd)}
.big{font-size:34px;font-weight:700;color:var(--gd)}
.ph{width:130px;height:130px;border:2px dashed var(--g);border-radius:14px;background:var(--c) center/cover;display:flex;align-items:center;justify-content:center;color:var(--m);font-size:12px;cursor:pointer;flex:none}
.slot{width:100%;aspect-ratio:4/3;border:2px dashed var(--g);border-radius:12px;background:var(--c) center/cover no-repeat;display:flex;align-items:center;justify-content:center;color:var(--m);font-size:12px;cursor:pointer;margin:8px 0;position:relative;text-align:center;padding:6px}.slot.sel{border-color:var(--gd);outline:2px solid var(--gd)}
.pv{display:none}
.note{font-size:12px;color:var(--m);margin:24px 0 8px;text-align:center}
@page{size:letter;margin:.5in}
@media print{nav,.btn,.noprint,.note,input[type=file]{display:none!important}
*{-webkit-print-color-adjust:exact;print-color-adjust:exact}
body{background:#fff;font-size:12px}main{max-width:none;padding:0}
.card,h3,tr,.day{break-inside:avoid}h2{break-after:avoid}
table{min-width:0}.tw{overflow:visible}.slot{break-inside:avoid}.pv{display:block!important;white-space:pre-wrap;overflow-wrap:anywhere;padding:8px 4px;border-bottom:1px solid #999;min-height:1.6em}td .pv{border:0}.own .pv{padding:16px 4px;min-height:2.6em}.own input[type=text]{padding:16px 4px}main h2:not(:first-child){break-before:page}.pg+.pg{break-before:page}.logv select{display:none}.logv .row{margin-bottom:18px}.logv .row input{padding:10px 4px;border-bottom:1px solid #666!important}input[type=date]::-webkit-calendar-picker-indicator,input[type=time]::-webkit-calendar-picker-indicator{display:none}input[type=date][value=""]::-webkit-datetime-edit,input[type=time][value=""]::-webkit-datetime-edit{color:transparent}.tw th:last-child,.tw td:last-child{display:none}td input{border-bottom:0!important}header{break-after:avoid}
input[type=text],input[type=date],input[type=time],input[type=number],textarea,select{border:0;border-bottom:1px solid #999;border-radius:0;background:transparent}}

body{background:linear-gradient(#fdf3ea,#f8e9de) fixed}:root{--bg:#fcf1e8}
header{background:transparent;color:var(--gd);padding:12px 18px}header h1{font:italic 700 26px/1.1 Georgia,"Times New Roman",serif}header p{font:italic 15px Georgia,serif;opacity:1}
nav{background:#e4e6d3;border-radius:28px;margin:6px 14px;box-shadow:0 1px 4px rgba(0,0,0,.08)}nav button{background:transparent;color:var(--gd);font-weight:600}nav button.on{background:var(--gd);color:#fff}
main.wide{max-width:1180px}.mt{margin-top:30px}.greet{font:italic 600 30px Georgia,serif;margin:4px 0 0}.sub{font-size:13px;margin-bottom:10px;color:var(--gd)}
.dash{display:grid;grid-template-columns:1.9fr 1fr;gap:16px}.dash>div{display:grid;gap:14px;align-content:start;min-width:0}
.top{display:grid;grid-template-columns:.9fr 1.1fr;gap:14px;align-items:center}
@media(max-width:860px){.dash,.top{grid-template-columns:1fr}}
.dc{background:#fffaf5;border-radius:22px;box-shadow:0 2px 8px rgba(80,70,50,.12);padding:16px}.dc.sg{background:#e3e9d8}.dc.pk{background:#f8d9d3}
.hero{background:#c9d3bd;border-radius:46% 54% 40% 60%/55% 50% 50% 45%;padding:14px;text-align:center}.hero img{width:78%;max-width:240px}
.big2{font:700 38px Georgia,serif;color:var(--gd)}.big2 span{color:#d9606b}.pill{background:#e3e9d8;border-radius:22px;padding:10px 16px;font-weight:700;color:var(--gd)}
.rh-h{display:flex;justify-content:space-between;align-items:center}.rh{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.rh>div{display:flex;gap:8px;align-items:center;position:relative;padding:8px;border-radius:14px;background:#fff;cursor:pointer}
.ico{font-size:30px}.ck{position:absolute;top:6px;right:6px;width:22px;height:22px;border:2px solid var(--g);border-radius:50%;text-align:center;font-size:13px;line-height:18px}.ck.on{background:var(--gd);border-color:var(--gd);color:#fff}
.jr{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}.j{background:#e3e9d8;border-radius:16px;text-align:center;padding:10px 4px;cursor:pointer}.j.pk{background:#f8d9d3}.j.cur{outline:3px solid var(--gd)}
@media(max-width:560px){.rh,.jr{grid-template-columns:1fr 1fr}}
.pf{width:110px;height:110px;border-radius:50%;border:4px solid #fff;background:#fff center/cover;display:flex;align-items:center;justify-content:center;color:var(--m);cursor:pointer;flex:none}
.big3{font:700 22px Georgia,serif;color:var(--gd)}.big3.s{font-size:18px}.rl{display:grid;grid-template-columns:repeat(3,1fr);text-align:center;gap:6px}.rl>div{cursor:pointer}.rl small{display:block}
.dc.lgs{padding-top:16px;overflow:hidden}
.big2{font-size:32px;white-space:nowrap}.rh>div{padding-right:34px}.pill{white-space:nowrap}/* swipe between tabs: soft fade on change */
.swl,.swr{animation:swfade .22s ease-out}
@keyframes swfade{from{opacity:.35}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.swl,.swr{animation:none}}

<button class="btn" data-tab="Today">🐾 Open today’s plan →</button></div></div>

<div class="dc"><b>🗺 Your puppy’s journey</b><div class="jr">${J.map((j,i)=>`<div class="j ${i%2?'pk':''} ${i==cur?'cur':''}" data-tab="Roadmap"><div class="ico">${j[0]}</div><small>${j[1]}</small><br><b>${j[2]}</b></div>`).join('')}</div></div>
</div><div>

</div></div>`+VIEWS.HomeDetails()},
HomeDetails(){return`<h2 class="mt">More about my puppy</h2>

<div class="row">${fld('nick','Nickname')}</div>
<div class="row">${fld('breed','Breed or mix')}${fld('bday','Birthday','date')}</div>
${fld('from','Where puppy came from (breeder / shelter / rescue)')}${fld('contact','Contact name and phone')}
<div class="row">${fld('color','Color and markings')}${fld('chip','Microchip number')}</div>
<div class="row">${fld('fav','Favorite things')}${fld('nofan','Not a fan of')}</div>${ta('first','First impressions')}
<h3>Our household agreement</h3>${AGREE.map((a,i)=>`<div class="row"><b style="flex:1 1 150px">${a}</b>${inp('ag'+i+'w','text','Who')}${inp('ag'+i+'t','text','When')}</div>`).join('')}
<h3>Our house rules</h3>${own('rule',6)}<button class="btn alt" onclick="window.print()">Print</button>`},

Roadmap(){const done=Array.from({length:90},(_,i)=>S.v['d'+(i+1)]).filter(Boolean).length;
const P=[['Phase 1','Days 1-14','Settling In','Weeks 1-2'],['Phase 2','Days 15-28','Building Routine','Weeks 3-4'],['Phase 3','Days 29-56','Learning the Rules','Weeks 5-8'],['Phase 4','Days 57-90','Growing Confidence','Weeks 9-13']];
let g='';for(let i=1;i<=90;i++){const c=CI.includes(i),dn=S.v['d'+i];g+=`<div class="day ${c?'ci':''} ${dn?'done':''}">${i}${c?' ⚑':''}${i==30||i==60?' 🦴':''}<input type="checkbox" data-k="d${i}" data-day ${dn?'checked':''}></div>`}
return`<h2>Your 90-Day Roadmap</h2><div class="card"><b id="prog">${done} of 90 days ticked</b><div class="bar"><i id="pbar" style="width:${done/.9}%"></i></div></div>
<div class="phases">${P.map((p,i)=>`<div class="card ${i%2?'pink':''}"><small>${p[0]} · ${p[1]}</small><br><b>${p[2]}</b><br><small>${p[3]}</small>${ta('focus'+i,'My focus')}</div>`).join('')}</div>
<h3>Day by day</h3><div class="grid">${g}</div><p><small>⚑ check-in day · 🦴 celebrate (Day 30 and 60)</small></p>
<h3>Weekly planner</h3><label>Week</label><select id="wk">${WEEKS.map((w,i)=>`<option value="${i}" ${(S.wk||0)==i?'selected':''}>Week ${i+1}: ${w}</option>`).join('')}</select><div id="wkbox">${weekBox(S.wk||0)}</div>`},

Today(){const k='t'+tday+'_';const pc=S.extra[tday+'p']||3;
return`<h2>Daily Page</h2><div class="row"><div><label>Date</label><input type="date" id="tday" value="${tday}"></div>${fld(k+'focus',"Today's focus")}</div>
<h3>Meals and water</h3>${[1,2,3].map(n=>`<div class="row"><div class="chk"><input type="checkbox" data-k="${k}m${n}" ${S.v[k+'m'+n]?'checked':''}><b>Meal ${n}</b></div>${inp(k+'mt'+n,'time')}${inp(k+'mw'+n,'text','what')}${inp(k+'ma'+n,'text','amount (per vet)')}</div>`).join('')}
<div class="row">${fld(k+'treats','Treats')}${chk(k+'water','Water checked')}</div>
<h3>Potty breaks</h3>${Array.from({length:pc},(_,i)=>`<div class="row">${inp(k+'pt'+i,'time')}${chk(k+'pp'+i,'pee')}${chk(k+'po'+i,'poop')}${chk(k+'px'+i,'oops')}${inp(k+'pw'+i,'text','where')}</div>`).join('')}
<button class="btn alt" data-addp>+ Add potty break</button>
<h3>Naps and sleep</h3><div class="row">${fld(k+'n1','Nap 1')}${fld(k+'n2','Nap 2')}${fld(k+'n3','Nap 3')}</div><div class="row">${fld(k+'bed','Bedtime','time')}${fld(k+'wake','Wake time','time')}${fld(k+'nn','Night notes')}</div>
<h3>Out and about</h3>${fld(k+'walk','Walk or outing (how long)')}${fld(k+'play','Play or training (how long)')}${fld(k+'new','New person, place or sound')}
<h3>Mood check</h3><div class="mood">${['Sleepy','Happy','Zoomies','Unsettled','Not myself'].map(m=>`<button data-mood="${k}mood|${m}" class="${S.v[k+'mood']==m?'on':''}">${m}</button>`).join('')}</div>
<h3>Wrap up</h3>${fld(k+'win',"Today's win")}${fld(k+'rem','Something I want to remember')}${fld(k+'vet','Anything unusual to mention to my vet or trainer')}`},

Logs(){const cols=LOGS[logSel],rows=S.logs[logSel]||[];
return`<h2>Trackers and Logs</h2><select id="logsel">${Object.keys(LOGS).map(l=>`<option ${l==logSel?'selected':''}>${l}</option>`).join('')}</select>
${logSel=='Health record'?`<div class="row">${fld('vetclinic','Vet clinic')}${fld('vetphone','Phone')}</div>`:''}
<div class="tw"><table><tr>${cols.map(c=>`<th>${c.split('|')[0]}</th>`).join('')}<th></th></tr>${rows.map((r,i)=>`<tr>${cols.map((c,j)=>`<td><input type="${c.split('|')[1]||'text'}" step="any" data-r="${i}" data-c="${j}" value="${esc(r[j])}"></td>`).join('')}<td><button class="btn alt" style="margin:2px" data-del="${i}">✕</button></td></tr>`).join('')}</table></div>
<button class="btn" id="addrow">+ Add row</button>${logSel=='Weight'?'<h3>Growth chart</h3>'+wchart(rows):''}`},

Checklists(){return`<h2>Puppy Shopping Checklist</h2>${group('sh',SHOP)}<h3>My extras</h3>${own('shx',5)}
<h2 style="margin-top:28px">Puppy-Proofing Checklist</h2><p><small>Walk through each room at puppy height.</small></p>${group('pf',PROOF)}`},

'Check-ins'(){return`<h2>Check-ins</h2><p><small>Days 7, 14, 28, 56 and 90. Rate each from 1 (tricky) to 5 (going well).</small></p>`+CI.map(d=>{const k='ci'+d+'_';return`<div class="card ${d%28==0?'pink':''}"><h3 style="background:none;padding:0">Day ${d} check-in</h3><div class="row">${fld(k+'date','Date','date')}${fld(k+'wt','Weight today')}</div>
${AREAS.map((a,i)=>`<div class="row"><b style="flex:1 1 200px">${a}</b>${rate(k+i)}</div>`).join('')}
${fld(k+'best','Our best moment')}${ta(k+'well','What has gone well')}${ta(k+'chg',"What I'd like to change")}${ta(k+'q','Questions for my vet or trainer')}${ta(k+'next','Focus for the next stretch')}</div>`}).join('')},

'Vet & Safety'(){return`<h2>Vet Visit Prep</h2>${list('vq',VETQ)}<h3>My own questions</h3>${own('vqx',5)}
<h3>Answers and notes</h3>${ta('vnotes','')}<h3>Bring with me</h3>${list('vb',['Paperwork from breeder or shelter','Notes on eating, sleeping and potty habits','This page and a pen'])}
<h2 style="margin-top:28px">Emergency Information</h2><p><small>Look up your local emergency vet and poison helpline today, and write the numbers in before you need them.</small></p>${EMER.map((e,i)=>fld('em'+i,e)).join('')}
<h2 style="margin-top:28px">Pet Sitter Sheet</h2>${SITTER.map((e,i)=>fld('ps'+i,e)).join('')}${ta('psr','Daily routine')}${ta('psa','Anything else')}<button class="btn alt" onclick="window.print()">Print for sitter</button>`},

Memories(){const M=[['Month 1 Memories','Days 1 to 30'],['Month 2 Memories','Days 31 to 60'],['Month 3 Memories','Days 61 to 90']],R=(n,f)=>Array.from({length:n},(_,i)=>f(i)).join(''),mini='style="grid-template-columns:repeat(auto-fit,minmax(110px,1fr))"';
return`<h2>Memories</h2>`+M.map((m,i)=>`<div class="card ${i%2?'pink':''}"><h3 style="background:none;padding:0">${m[0]} <small>${m[1]}</small></h3><label>Photo of the month</label><div style="max-width:300px">${slot('mm'+i,'4/3')}</div><label>More favorites</label><div class="phases" ${mini}>${R(4,j=>slot('mm'+i+'f'+j,'1/1'))}</div>${ta('mm'+i+'b','Best moment this month')}${ta('mm'+i+'n','New things we tried')}</div>`).join('')
+`<h3>Snapshot wall</h3><p><small>Add a photo, a date and a caption.</small></p><div class="phases">${R(6,i=>`<div class="card ${i%2?'pink':''}">${slot('sw'+i)}${fld('sw'+i+'d','Date','date')}${fld('sw'+i+'c','Caption')}</div>`)}</div>
<h3>Growing up in photos</h3><p><small>One photo a week. Same spot or same pose, if you can, so you can see the change.</small></p><div class="phases" ${mini}>${R(14,i=>`<div class="card ${i%2?'pink':''}"><b>${i<13?'Week '+(i+1):'Day 90'}</b>${slot('gw'+i,'3/4')}</div>`)}</div>${ta('gwc','What changed the most?')}
<h3>My favorite photo</h3>${slot('favph')}<div class="row">${fld('favd','Date','date')}${fld('favb','Taken by')}</div>${ta('favw',"Why it's my favorite")}`},
Backup(){return`<h2>Backup and Restore</h2><p>Your entries are saved in this browser on this device only. Save a backup now and then, so you can restore it if you clear your browser data or switch devices.</p>
<button class="btn" id="exp">Download backup file</button><button class="btn alt" id="cpy">Copy backup text</button>
<h3>Restore</h3><p><small>Restoring replaces everything currently in this planner.</small></p>
<label>Choose a backup file</label><input type="file" id="impf" accept=".json,application/json">
<label>Or paste backup text</label><textarea id="impt"></textarea><button class="btn" id="imp">Restore from pasted text</button><p id="bmsg"></p>`},
Milestones(){return`<h2>First Milestones</h2><div class="phases">${MILE.map((m,i)=>`<div class="card ${i%2?'pink':''}"><b>${m}</b>${slot('ms'+i)}${fld('ms'+i+'d','Date','date')}${fld('ms'+i+'n','Note')}</div>`).join('')}</div>
<h2 style="margin-top:24px">Day 1 and Day 90</h2><div class="phases">${['Day 1','Day 90'].map((d,i)=>`<div class="card ${i?'':'pink'}"><b>${d}</b>${slot('cmp'+i)}${fld('cmp'+i+'d','Date','date')}${fld('cmp'+i+'w','Weight')}${fld('cmp'+i+'f','Favorite thing')}${fld('cmp'+i+'n','Favorite nap spot')}</div>`).join('')}</div>
${ta('chg','What has changed')}${ta('learn',"What I've learned together")}${ta('proud',"What I'm proudest of")}${ta('tell','What I’d tell myself on Day 1')}`}
};

function weekBox(i){const k='wk'+i+'_';return`<div class="card ${i>=2&&i<4||i>7?'pink':''}"><i>${THEME[i]}</i></div><div class="row"><div>${fld(k+'of','Week of','date')}</div></div>
${ta(k+'setup','This week I’ll set up')}${ta(k+'ask','Ask my vet or trainer about')}${ta(k+'plan','My week (morning, midday, afternoon, evening, night)')}${fld(k+'well','One thing that went well')}${fld(k+'adj','One thing to adjust')}`}
function wchart(rows){const p=rows.filter(r=>r[0]&&parseFloat(r[1])>0).map(r=>[new Date(r[0]).getTime(),parseFloat(r[1])]).sort((a,b)=>a[0]-b[0]);
if(p.length<2)return'<p><small>Add two or more weights to see your chart.</small></p>';
const xs=p.map(a=>a[0]),ys=p.map(a=>a[1]),x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys)*.95,y1=Math.max(...ys)*1.05;
const pts=p.map(a=>`${30+(a[0]-x0)/(x1-x0||1)*440},${150-(a[1]-y0)/(y1-y0||1)*130}`);
return`<svg viewBox="0 0 500 170" style="width:100%;background:var(--c);border-radius:12px"><polyline fill="none" stroke="var(--gd)" stroke-width="3" points="${pts.join(' ')}"/>${pts.map(q=>`<circle cx="${q.split(',')[0]}" cy="${q.split(',')[1]}" r="4" fill="var(--gd)"/>`).join('')}<text x="4" y="24" font-size="11" fill="var(--m)">${y1.toFixed(1)}</text><text x="4" y="150" font-size="11" fill="var(--m)">${y0.toFixed(1)}</text></svg>`}

function render(){$('#main').className=tab=='Home'?'wide':'';$('#nav').innerHTML=TABS.map(t=>`<button class="${t==tab?'on':''}" data-tab="${t}">${IC[t]||''} ${t}</button>`).join('');
$('#main').innerHTML=VIEWS[tab]()+'<div class="noprint" style="margin-top:20px"><button class="btn alt" onclick="window.print()">🖨 Print this page</button><button class="btn alt" onclick="printAll()">🖨 Print full planner</button></div>';const n=V('name');$('#sub').textContent=n?n+'’s first 90 days':'A calmer start, one day at a time ♡'}
function updProg(){const d=Array.from({length:90},(_,i)=>S.v['d'+(i+1)]).filter(Boolean).length;$('#prog').textContent=d+' of 90 days ticked';$('#pbar').style.width=d/.9+'%'}

document.addEventListener('input',e=>{const t=e.target;if(t.tagName=='TEXTAREA'){t.style.height='auto';t.style.height=Math.max(70,t.scrollHeight+2)+'px'}if(t.tagName=='INPUT'&&t.type!='checkbox'&&t.type!='file')t.setAttribute('value',t.value);
if(t.dataset.k){S.v[t.dataset.k]=t.type=='checkbox'?t.checked:t.value;save();
if('day' in t.dataset){t.closest('.day').classList.toggle('done',t.checked);updProg()}
if(t.dataset.k=='name'||t.dataset.k=='gotcha'){$('#sub').textContent=V('name')?V('name')+'’s first 90 days':'A calmer start, one day at a time ♡'}}
else if(t.dataset.r!==undefined){const r=S.logs[logSel];r[t.dataset.r][t.dataset.c]=t.value;save()}
else if(t.id=='tday'&&t.value){tday=t.value;render()}
else if(t.id=='logsel'){logSel=t.value;render()}
else if(t.id=='wk'){S.wk=+t.value;save();$('#wkbox').innerHTML=weekBox(S.wk)}
else if(t.id=='file'&&t.files[0]){const img=new Image();img.onload=()=>{const c=document.createElement('canvas'),s=Math.min(1,320/Math.max(img.width,img.height));c.width=img.width*s;c.height=img.height*s;c.getContext('2d').drawImage(img,0,0,c.width,c.height);S.photo=c.toDataURL('image/jpeg',.75);save();render()};img.src=URL.createObjectURL(t.files[0])}});
document.addEventListener('click',e=>{const t=e.target.closest('[data-tab],[data-rate],[data-mood],[data-del],#addrow,[data-addp],#ph');if(!t)return;
if(t.dataset.tab){tab=t.dataset.tab;render();scrollTo(0,0)}
else if(t.dataset.rate){const[k,n]=t.dataset.rate.split('|');S.v[k]=+n;save();render()}
else if(t.dataset.mood){const[k,m]=t.dataset.mood.split('|');S.v[k]=m;save();render()}
else if(t.dataset.del!==undefined){S.logs[logSel].splice(t.dataset.del,1);save();render()}
else if(t.id=='addrow'){(S.logs[logSel]=S.logs[logSel]||[]).push(LOGS[logSel].map(()=>''));save();render()}
else if('addp' in t.dataset){S.extra[tday+'p']=(S.extra[tday+'p']||3)+1;save();render()}
else if(t.id=='ph'){$('#file').click()}});
function printAll(){const sv=[tab,logSel];let out='<div class="noprint" style="margin:10px 0"><button class="btn" onclick="render()">← Back to planner</button> <small>Opening your print dialog. Use this button to return.</small></div>';
['Home','Roadmap','Today','Checklists','Check-ins','Vet & Safety','Milestones','Memories'].forEach(t=>{tab=t;let x=VIEWS[t]();
if(t=='Roadmap'){x=x.split('<h3>Weekly planner</h3>')[0];out+=`<div class="pg">${x}</div>`+WEEKS.map((w,i)=>`<div class="pg"><h2>Week ${i+1}: ${w}</h2>${weekBox(i)}</div>`).join('')}
else out+=`<div class="pg">${x}</div>`});
const L=JSON.parse(JSON.stringify(S.logs));
Object.keys(LOGS).forEach(n=>{logSel=n;const r=(L[n]||[]).slice();while(r.length<22)r.push(LOGS[n].map(()=>''));S.logs[n]=r;out+=`<div class="pg logv">${VIEWS.Logs().replace('<h2>Trackers and Logs</h2>','<h2>'+n+'</h2>')}</div>`});
S.logs=L;tab=sv[0];logSel=sv[1];$('#main').innerHTML=out;setTimeout(()=>window.print(),300)}
const msg=t=>{const m=$('#bmsg');if(m)m.textContent=t};
function restore(txt){try{const o=JSON.parse(txt);if(!o||typeof o!='object'||!o.v)throw 0;o.logs=o.logs||{};o.photos=o.photos||{};o.extra=o.extra||{};S=o;save();render();msg('Restored.')}catch(e){msg('That does not look like a valid backup.')}}
document.addEventListener('click',e=>{const id=e.target.id;
if(id=='exp'){const b=new Blob([JSON.stringify(S)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='puppy-90-days-backup-'+iso(new Date())+'.json';document.body.appendChild(a);a.click();a.remove();msg('If no file downloaded, use Copy backup text instead and keep it somewhere safe.')}
else if(id=='cpy'){const t=JSON.stringify(S),ta=$('#impt');const done=()=>msg('Copied. Paste it into a note or email to yourself.');const fb=()=>{ta.value=t;ta.select();msg('Select all the text in the box, copy it, and keep it somewhere safe.')};
try{navigator.clipboard.writeText(t).then(done,fb)}catch(x){fb()}}
else if(id=='imp'){restore($('#impt').value)}});
document.addEventListener('change',e=>{if(e.target.id=='impf'&&e.target.files[0]){const r=new FileReader();r.onload=()=>restore(r.result);r.readAsText(e.target.files[0])}});
let swp=[];
addEventListener('beforeprint',()=>{if(swp.length)return;document.querySelectorAll('input[type=text],input[type=number],textarea').forEach(i=>{if(!i.value)return;const d=document.createElement('div');d.className='pv';d.textContent=i.value;i.after(d);i.style.display='none';swp.push([i,d])})});
addEventListener('afterprint',()=>{swp.forEach(([i,d])=>{d.remove();i.style.display=''});swp=[]});
function addPhoto(file,key){const img=new Image();img.onload=()=>{const c=document.createElement('canvas'),s=Math.min(1,480/Math.max(img.width,img.height));c.width=img.width*s;c.height=img.height*s;c.getContext('2d').drawImage(img,0,0,c.width,c.height);S.photos[key]=c.toDataURL('image/jpeg',.75);save();render()};img.src=URL.createObjectURL(file)}
document.addEventListener('click',e=>{const d=e.target.closest('[data-sdel]');if(d){delete S.photos[d.dataset.sdel];save();render();return}
const s=e.target.closest('[data-slot]');if(s){pk=s.dataset.slot;document.querySelectorAll('.slot').forEach(x=>x.classList.toggle('sel',x===s));$('#pfile').click()}});
document.addEventListener('change',e=>{if(e.target.id=='pfile'&&e.target.files[0]&&pk){addPhoto(e.target.files[0],pk);e.target.value=''}});
document.addEventListener('paste',e=>{const f=Array.from((e.clipboardData&&e.clipboardData.files)||[]).find(x=>x.type.startsWith('image/'));if(f&&pk){e.preventDefault();addPhoto(f,pk)}});
/* swipe between tabs */
(function(){
 var x0=0,y0=0,t0=0,ok=false,skip="input,textarea,select,.tw,#nav,[contenteditable]";
 document.addEventListener("touchstart",function(e){
  ok=false;
  if(e.touches.length!==1)return;
  var t=e.touches[0];
  if(t.clientX<24||t.clientX>window.innerWidth-24)return;
  if(e.target.closest&&e.target.closest(skip))return;
  x0=t.clientX;y0=t.clientY;t0=Date.now();ok=true;
 },{passive:true});
 document.addEventListener("touchmove",function(e){if(e.touches.length>1)ok=false},{passive:true});
 document.addEventListener("touchend",function(e){
  if(!ok)return;ok=false;
  var t=e.changedTouches[0],dx=t.clientX-x0,dy=t.clientY-y0;
  if(Date.now()-t0>700||Math.abs(dx)<70||Math.abs(dx)<Math.abs(dy)*1.8)return;
  var sel=window.getSelection&&window.getSelection();if(sel&&!sel.isCollapsed)return;
  var n=TABS.indexOf(tab)+(dx<0?1:-1);
  if(n<0||n>=TABS.length)return;
  tab=TABS[n];render();scrollTo(0,0);
  var m=$("#main");m.classList.remove("swl","swr");void m.offsetWidth;m.classList.add(dx<0?"swl":"swr");
  var on=document.querySelector("#nav .on");if(on&&on.scrollIntoView)on.scrollIntoView({inline:"center",block:"nearest"});
 },{passive:true});
})();
render();
</script><script>
if("serviceWorker" in navigator && /^https?:$/.test(location.protocol)){
  window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})});
}
</script>
